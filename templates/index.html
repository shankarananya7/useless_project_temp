<!DOCTYPE html>

<html>

<head>

    <title>TrainSeat AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="container">


    <div class="header">

        <div class="logo">
            🚆 TRAINSEAT AI
        </div>

        <div class="subtitle">
            Train Seat Scenery & Experience Predictor
        </div>

    </div>


    <div class="card">

        <h2>🔮 Analyze Your Seat</h2>

        <p>
            Enter your journey details and let our extremely
            unnecessary prediction system judge your seat.
        </p>


        <hr>


        <!-- THE FORM -->

        <form action="/predict" method="POST">


            <!-- ROUTE -->

            <label>Route:</label>

            <select name="route">

                <option value="trivandrum_chennai">
                    Trivandrum → Chennai
                </option>

                <option value="trivandrum_kollam">
                    Trivandrum → Kollam
                </option>

                <option value="chennai_bangalore">
                    Chennai → Bangalore
                </option>

            </select>


            <br><br>


            <!-- TRAIN -->

            <label>Train:</label>

            <select name="train">

                <option>
                    Express
                </option>

                <option>
                    Superfast Express
                </option>

                <option>
                    Passenger
                </option>

            </select>


            <br><br>


            <!-- COACH -->

            <label>Coach:</label>

            <select name="coach">

                <option>S1</option>
                <option>S2</option>
                <option>S3</option>
                <option>S4</option>
                <option>S5</option>
                <option>S6</option>

            </select>


            <br><br>


            <!-- SEAT -->

            <label>Seat Number:</label>

            <input
                type="number"
                name="seat"
                min="1"
                max="100"
                value="45"
                required
            >


            <br><br>


            <!-- WINDOW SIDE -->

            <label>Window Side:</label>

            <select name="side">

                <option value="Left">
                    Left
                </option>

                <option value="Right">
                    Right
                </option>

            </select>


            <br><br>


            <!-- TIME -->

            <label>Departure Time:</label>

            <input
                type="time"
                name="time"
                value="07:00"
                required
            >


            <br><br><br>


            <button type="submit">

                🔮 ANALYZE MY SEAT



            </button>
            <br><br>

            <button
                type="submit"
                formaction="/best-seat">

                🏆 FIND MY BEST SEAT

            </button>


        </form>

    </div>

</div>

</body>

</html>
